# Description: Auto compile
#

#
# Fork and compile the latest version yourself using Github Actions
#   1.Into the repository of your own fork
#   2.Into the repository [Settings]
#   3.[Code and automation - Actions] ↓ [General] → [Workflow permissions] ↓  Check the [Read and write permissions] and [Save]
#   4.Let's take [Actions]
#

name: "Auto compile with OpenWrt SDK"
on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: "SSH connection to Actions"
        required: false
        default: "false"
  push:
    branches:
      - "master"
    paths:
      - "Makefile"
env:
  TZ: Asia/Shanghai

jobs:
  job_check:
    if: github.repository == ${{ github.repository }}
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      argon_version: ${{ steps.check_version.outputs.latest_version }}
      has_update: ${{ steps.check_version.outputs.has_update }}
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          ref: "master"

      - name: Check version
        id: check_version
        env:
          url_release: https://api.github.com/repos/${{ github.repository }}/releases/latest
        run: |
          latest_version="v$(date +%Y%m%d%H%M)"
          latest_release=$(wget -qO- -t1 -T2 ${{env.url_release}} | awk -F '"' '/tag_name/{print $4}')
          package_version=$(sed -n 's/^PKG_VERSION:=//p' Makefile)
          has_update=$([ "${latest_version}" != "${latest_release}" ] && echo true || echo false)
          echo "latest_version=${latest_version}" >> $GITHUB_OUTPUT
          echo "package_version=${package_version}" >> $GITHUB_OUTPUT
          echo "has_update=${has_update}" >> $GITHUB_OUTPUT
          echo "latest_version: ${latest_version}"
          echo "latest_release: ${latest_release}"
          echo "has_update: ${has_update}"

      - name: Generate new tag & release
        if: steps.check_version.outputs.has_update == 'true'
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Argon 2026 v${{ steps.check_version.outputs.package_version }}
          tag_name: ${{steps.check_version.outputs.latest_version}}
          body: |
            ## 版本基线
            - 本主题版本：`${{ steps.check_version.outputs.package_version }}`
            - 上游基线：[`jerrykuku/luci-theme-argon` v2.4.7 `2a28799`](https://github.com/jerrykuku/luci-theme-argon/commit/2a28799ca063aba7edc3314143b93c8325c86df4)（PR #702）

            ## 本次优化
            - 合并上游的主题资源、元数据与界面兼容性更新。
            - 恢复本地圆角变量、浅色 SVG 文字显示规则及深色 SVG 文字适配。
            - 修复表格内 LuCI 下拉菜单被圆角容器裁剪的问题。
            - 收紧表单行与动态列表的纵向间距至 `0.2rem`。
            - 包含 24.10（opkg / `.ipk`）与 25.12（apk / `.apk`）构建产物。

  job_build_argon_ipk:
    name: Build Argon ipk (24.10)
    needs: job_check
    if: needs.job_check.outputs.has_update == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Install packages
        run: |
          echo "Install packages"
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install zstd build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-venv rsync unzip zlib1g-dev file wget
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      - name: Cache openwrt SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: sdk
          key: openwrt-sdk-24.10.7-x86-64

      - name: Initialization environment
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        env:
          url_sdk: https://downloads.openwrt.org/releases/24.10.7/targets/x86/64/openwrt-sdk-24.10.7-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
        run: |
          wget ${{ env.url_sdk }}
          file_name=$(echo ${{env.url_sdk}} | awk -F/ '{print $NF}')
          mkdir sdk && tar --zstd -xvf $file_name -C ./sdk --strip-components=1
          cd sdk
          ./scripts/feeds update -a
          echo "CONFIG_PACKAGE_luci-theme-argon-2026=m" > .config
          ./scripts/feeds install -d n luci-theme-argon-2026
          make download -j8

      - name: Configure Argon (master)
        run: |
          cd sdk
          rm -rf package/downloads/luci-theme-argon-2026
          git clone -b master https://github.com/${{ github.repository }}.git package/downloads/luci-theme-argon-2026
          ./scripts/feeds install luci-theme-argon-2026
          echo "CONFIG_ALL_NONSHARED=n" > .config
          echo "CONFIG_ALL_KMODS=n" >> .config
          echo "CONFIG_ALL=n" >> .config
          echo "CONFIG_AUTOREMOVE=n" >> .config
          echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-argon-2026=m" >> .config
          make defconfig

      - name: Compile Argon (master)
        id: compile
        run: |
          cd sdk
          echo "make package/luci-theme-argon-2026/{clean,compile} -j$(nproc)"
          make package/luci-theme-argon-2026/{clean,compile} -j$(nproc)
          mv bin/packages/x86_64/base/ ../
          rm .config .config.old
          cd ..
          echo "status=success" >> $GITHUB_OUTPUT
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV

      - name: Upload Argon (master) ipks to release
        uses: softprops/action-gh-release@v2
        if: steps.compile.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{needs.job_check.outputs.argon_version}}
          files: ${{ env.FIRMWARE }}/base/luci-theme-argon-2026*.*

  job_build_argon_apk:
    name: Build Argon apk (25.12)
    needs: job_check
    if: needs.job_check.outputs.has_update == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Install packages
        run: |
          echo "Install packages"
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install zstd build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-venv rsync unzip zlib1g-dev file wget
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      - name: Cache openwrt SDK (apk)
        id: cache-sdk-apk
        uses: actions/cache@v3
        with:
          path: sdk_apk
          key: openwrt-sdk-25.12.5-x86-64

      - name: Initialization environment (apk)
        if: steps.cache-sdk-apk.outputs.cache-hit != 'true'
        env:
          url_sdk: https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
        run: |
          wget ${{ env.url_sdk }}
          file_name=$(echo ${{env.url_sdk}} | awk -F/ '{print $NF}')
          mkdir sdk_apk && tar --zstd -xvf $file_name -C ./sdk_apk --strip-components=1
          cd sdk_apk
          ./scripts/feeds update -a
          echo "CONFIG_PACKAGE_luci-theme-argon-2026=m" > .config
          ./scripts/feeds install -d n luci-theme-argon-2026
          make download -j8

      - name: Configure Argon (apk)
        run: |
          cd sdk_apk
          rm -rf package/downloads/luci-theme-argon-2026
          git clone -b master https://github.com/${{ github.repository }}.git package/downloads/luci-theme-argon-2026
          ./scripts/feeds install luci-theme-argon-2026
          echo "CONFIG_ALL_NONSHARED=n" > .config
          echo "CONFIG_ALL_KMODS=n" >> .config
          echo "CONFIG_ALL=n" >> .config
          echo "CONFIG_AUTOREMOVE=n" >> .config
          echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-argon-2026=m" >> .config
          make defconfig

      - name: Compile Argon (apk)
        id: compile_apk
        run: |
          cd sdk_apk
          echo "make package/luci-theme-argon-2026/{clean,compile} -j$(nproc)"
          make package/luci-theme-argon-2026/{clean,compile} -j$(nproc)
          mv bin/packages/x86_64/base/ ../base_apk
          rm .config .config.old
          cd ..
          echo "status=success" >> $GITHUB_OUTPUT
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV

      - name: Upload Argon (master) apks to release
        uses: softprops/action-gh-release@v1
        if: steps.compile_apk.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{needs.job_check.outputs.argon_version}}
          files: ${{ env.FIRMWARE }}/base_apk/luci-theme-argon-2026*.apk
